name: Visual regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'blocks/**'
      - 'scripts/**'
      - 'styles/**'
      - 'head.html'
      - 'tools/quality/broadridge-visual-check.mjs'
      - 'tools/quality/broadridge-visual-parse-pr.mjs'
      - 'tools/quality/broadridge-visual-targets.json'
  workflow_dispatch:
    inputs:
      base:
        description: 'Override BEFORE origin (default: production/live main)'
        required: false
      candidate:
        description: 'Override AFTER origin (default: this branch preview)'
        required: false

# Regression = BEFORE (EDS main) vs AFTER (branch). See docs/broadridge-VISUAL-TESTING.md.
# If the PR description lists `before=`/`after=` URLs (visual:start block), those exact pages are used;
# otherwise it falls back to the default manifest (main live vs branch preview for every listed path).
# Report-only for sprint one (continue-on-error). No baseline PNGs committed.

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.inputs.base || format('https://main--da-broadridge-cit--{0}.aem.live', github.repository_owner) }}
      CANDIDATE: ${{ github.event.inputs.candidate || (github.head_ref && format('https://{0}--da-broadridge-cit--{1}.aem.page', github.head_ref, github.repository_owner)) || format('https://main--da-broadridge-cit--{0}.aem.page', github.repository_owner) }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build manifest (PR before/after URLs, else default main-vs-branch)
        id: manifest
        run: |
          node tools/quality/broadridge-visual-parse-pr.mjs --mode regression --out /tmp/vt.json
          count=$(node -e "process.stdout.write(String(require('/tmp/vt.json').length))")
          if [ "$count" = "0" ]; then
            echo "No PR-supplied URLs; using default manifest (main live vs branch preview)."
            cp tools/quality/broadridge-visual-targets.json /tmp/vt.json
            echo "use_origins=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for branch preview
        if: github.head_ref != ''
        continue-on-error: true
        run: |
          P="https://${{ github.head_ref }}--da-broadridge-cit--${{ github.repository_owner }}.aem.page/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$P" || true)
            echo "attempt $i: $P -> $code"; [ "$code" = "200" ] && exit 0; sleep 15
          done
      - name: Run regression diff (report-only)
        continue-on-error: true
        run: |
          if [ "${{ steps.manifest.outputs.use_origins }}" = "1" ]; then
            npm run broadridge:test:visual -- --manifest /tmp/vt.json --base "$BASE" --candidate "$CANDIDATE" --report-only
          else
            npm run broadridge:test:visual -- --manifest /tmp/vt.json --report-only
          fi
          cat tools/quality/visual-output/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: tools/quality/visual-output/
          if-no-files-found: ignore
